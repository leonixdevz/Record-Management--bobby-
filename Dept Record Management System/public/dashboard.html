<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Records - Record System</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/theme.js"></script>
</head>
<body>
    <nav class="main-nav">
        <div class="nav-brand"><span class="brand-mark">R</span>Record System</div>
        <div class="nav-links">
            <a href="/dashboard.html">Records</a>
            <a href="/corrections.html">Corrections</a>
            <a href="/settings.html">Settings</a>
            <span class="theme-slot"></span>
            <button id="logoutBtn">Logout</button>
        </div>
    </nav>

    <main class="container">
        <div class="header-row">
            <div>
                <h1 id="colTitle">Loading collection...</h1>
                <p id="colMeta"></p>
            </div>
            <div class="actions">
                <button class="btn-secondary" id="exportBtn">Export JSON</button>
                <button class="btn-secondary" id="importBtn">Import JSON</button>
                <button class="btn-secondary" id="dedupBtn">Clean Duplicates</button>
                <button class="btn-primary" id="addRecBtn">+ Add Record</button>
            </div>
        </div>

        <div class="filter-bar card">
            <input type="text" id="searchBox" placeholder="Search any field..." autocomplete="off">
            <button class="btn-secondary" id="searchBtn">Search</button>
        </div>

        <div class="table-container card">
            <table id="recordsTable">
                <thead>
                    <tr id="tableHead">
                        <!-- Headers generated by schema -->
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Rows generated by data -->
                </tbody>
            </table>
            <div id="emptyState" class="empty-hero hidden" style="display:none;">
                <div class="empty-icon">⌕</div>
                <h3>No records found</h3>
                <p id="emptyMsg">Add your first record to get started, or adjust your search.</p>
                <button class="btn-primary" id="emptyAddBtn">+ Add Record</button>
            </div>
        </div>
    </main>

    <!-- Modal for Add/Edit -->
    <div id="modalOverlay" class="modal-overlay hidden" style="display:none;">
        <div class="modal-content">
            <div id="modalBody"></div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn-primary" id="modalConfirm">Save Record</button>
            </div>
        </div>
    </div>

    <!-- Details modal (student overview + courses + CGPA) -->
    <div id="detailsOverlay" class="modal-overlay hidden" style="display:none;">
        <div class="modal-content wide-modal">
            <div id="detailsBody"></div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeDetails()">Close</button>
            </div>
        </div>
    </div>

    <!-- Add course modal (single + bulk) -->
    <div id="courseOverlay" class="modal-overlay hidden" style="display:none;">
        <div class="modal-content wide-modal">
            <div id="courseBody"></div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeCourse()">Cancel</button>
                <button class="btn-primary" id="courseConfirm">Save Courses</button>
            </div>
        </div>
    </div>

    <div id="toastHost" aria-live="polite"></div>

    <script src="/js/app.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let colId = urlParams.get('colId');
        let currentSchema = [];
        let currentRecordCount = null;

        async function init() {
            // If no collection is explicitly selected, automatically fall back to
            // the department's primary collection so login lands on a working view.
            if (!colId) {
                try {
                    const primary = await api.getPrimaryCollection();
                    if (primary && primary.id) colId = primary.id;
                } catch (e) { /* no primary yet */ }
            }

            if (!colId) {
                showToast('No collection selected', 'error');
                window.location.href = '/dashboard.html';
                return;
            }

            const cols = await api.getCollections();
            const col = cols.find(c => c.id === colId);
            if (!col) {
                showToast('Collection not found', 'error');
                window.location.href = '/dashboard.html';
                return;
            }
            document.getElementById('colTitle').textContent = col.name;
            currentSchema = col.schema;

            renderTableHead();
            await loadRecords();
        }

        function renderTableHead() {
            const head = document.getElementById('tableHead');
            head.innerHTML = currentSchema.map(s => `<th>${escapeHtml(s.label)}</th>`).join('') +
                             `<th>Actions</th>`;
        }

        async function loadRecords() {
            const search = document.getElementById('searchBox').value;
            const records = await api.getRecords(colId, search);
            const body = document.getElementById('tableBody');
            const emptyState = document.getElementById('emptyState');

            currentRecordCount = records.length;

            if (records.length === 0) {
                body.innerHTML = '';
                const searching = search.trim() !== '';
                document.getElementById('emptyMsg').textContent = searching
                    ? 'No records match your search. Try a different term or clear it.'
                    : 'Add your first record to get started.';
                emptyState.style.display = '';
                updateMeta(0, searching);
                return;
            }

            emptyState.style.display = 'none';
            body.innerHTML = records.map(rec => `
                <tr>
                    ${currentSchema.map(s => `<td>${escapeHtml(String(rec[s.name] ?? ''))}</td>`).join('')}
                    <td>
                        <button onclick="viewDetails('${rec.id}')" class="btn-sm">Details</button>
                        <button onclick="editRecord('${rec.id}')" class="btn-sm">Edit</button>
                        <button onclick="deleteRecord('${rec.id}')" class="btn-sm btn-danger">Delete</button>
                    </td>
                </tr>
            `).join('');
            updateMeta(records.length, false);
        }

        function updateMeta(count, searching) {
            const meta = document.getElementById('colMeta');
            if (count === null) { meta.textContent = ''; return; }
            meta.textContent = `${count} record${count === 1 ? '' : 's'}${searching ? ' (filtered)' : ''}`;
        }

        function openRecordModal(recId = null) {
            const body = document.getElementById('modalBody');
            const isEdit = !!recId;

            body.innerHTML = `
                <h2>${isEdit ? 'Edit record' : 'Add new record'}</h2>
                <div class="form-grid">
                    ${currentSchema.map(s => `
                        <div class="form-group">
                            <label>${escapeHtml(s.label)} ${s.required ? '*' : ''}</label>
                            ${s.type === 'textarea'
                                ? `<textarea id="f_${s.name}" rows="3"></textarea>`
                                : `<input type="${s.type}" id="f_${s.name}" ${s.required ? 'required' : ''}>`
                            }
                        </div>
                    `).join('')}
                </div>
            `;

            window.currentEditingId = isEdit ? recId : null;
            document.getElementById('modalOverlay').classList.remove('hidden');
            document.getElementById('modalOverlay').style.display = '';
        }

        async function saveRecord() {
            const data = {};
            currentSchema.forEach(s => {
                data[s.name] = document.getElementById(`f_${s.name}`).value;
            });

            try {
                if (window.currentEditingId) {
                    await api.updateRecord(colId, window.currentEditingId, data);
                } else {
                    await api.addRecord(colId, data);
                }
                closeModal();
                showToast('Record saved', 'success');
                await loadRecords();
            } catch (e) {
                showToast(e.message, 'error');
            }
        }

        async function deleteRecord(id) {
            if (confirm('Delete this record?')) {
                await api.deleteRecord(colId, id);
                showToast('Record deleted', 'success');
                await loadRecords();
            }
        }

        async function editRecord(id) {
            openRecordModal(id);
            const records = await api.getRecords(colId);
            const rec = records.find(r => r.id === id);
            if (rec) {
                currentSchema.forEach(s => {
                    const el = document.getElementById(`f_${s.name}`);
                    if (el) el.value = rec[s.name] || '';
                });
            }
        }

        // Convert a numeric score to a grade point on the standard 5-point scale
        // (mirrors server.js / portal.html so weights stay consistent everywhere).
        function gradePoint(score) {
            const s = Number(score);
            if (isNaN(s)) return 0;
            if (s >= 70) return 5.0;
            if (s >= 60) return 4.0;
            if (s >= 50) return 3.0;
            if (s >= 45) return 2.0;
            if (s >= 40) return 1.0;
            return 0.0;
        }

        // Weighted-points-to-credit-units CGPA (same as portal.html).
        function computeCgpa(courses) {
            // Guard against courses being a non-array object (e.g. from bad data).
            if (!Array.isArray(courses)) return '0.00';
            let totalPoints = 0;
            let totalUnits = 0;
            courses.forEach(c => {
                const cu = Number(c.creditUnits) || 0;
                totalUnits += cu;
                totalPoints += gradePoint(c.score) * cu;
            });
            if (totalUnits === 0) return '0.00';
            return (totalPoints / totalUnits).toFixed(2);
        }

        // Details modal helpers
        function openDetails(recordId) {
            window.currentDetailId = recordId;
            document.getElementById('detailsOverlay').classList.remove('hidden');
            document.getElementById('detailsOverlay').style.display = '';
            loadDetail(recordId);
        }

        function closeDetails() {
            document.getElementById('detailsOverlay').classList.add('hidden');
            document.getElementById('detailsOverlay').style.display = 'none';
            window.currentDetailId = null;
        }

        async function loadDetail(recordId) {
            const body = document.getElementById('detailsBody');
            try {
                const [record, courses] = await Promise.all([
                    api.studentData(recordId),
                    api.studentCourses(recordId)
                ]);
                body.innerHTML = `
                    <div class="details-header">
                        <h2>Student overview</h2>
                        <p><strong>ID:</strong> ${escapeHtml(String(record.student_id ?? ''))}</p>
                        <p><strong>Full name:</strong> ${escapeHtml(String(record.full_name ?? ''))}</p>
                        <p><strong>Level:</strong> ${escapeHtml(String(record.level ?? ''))}</p>
                        <p><strong>CGPA:</strong> <span style="font-size:1.5rem; color:var(--primary); font-weight:800;">${computeCgpa(courses)}</span></p>
                    </div>
                    <div class="details-section">
                        <h3>Courses by session &amp; level</h3>
                        ${Array.isArray(courses) && courses.length > 0 ? `
                            <div class="courses-grid">
                                ${Object.entries(Object.groupBy(courses, c => `${c.session} | ${c.level}`)).map(([key, list]) => `
                                    <div class="course-group">
                                        <h4>${escapeHtml(key)}</h4>
                                        <table class="course-table">
                                            <thead>
                                                <tr>
                                                    <th>Semester</th>
                                                    <th>Course code</th>
                                                    <th>Course title</th>
                                                    <th>Units</th>
                                                    <th>Score</th>
                                                    <th>Grade point</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                ${list.map(c => `
                                                    <tr>
                                                        <td>${escapeHtml(String(c.semester ?? ''))}</td>
                                                        <td class="mono">${escapeHtml(String(c.courseCode ?? ''))}</td>
                                                        <td>${escapeHtml(String(c.courseTitle ?? ''))}</td>
                                                        <td class="mono">${escapeHtml(String(c.creditUnits ?? ''))}</td>
                                                        <td class="mono">${escapeHtml(String(c.score ?? ''))}</td>
                                                        <td class="mono">${escapeHtml(String(c.gradePoint ?? gradePoint(c.score)))}</td>
                                                    </tr>
                                                `).join('')}
                                            </tbody>
                                            <tfoot>
                                                <tr>
                                                    <td colspan="5" style="text-align:right;"><strong>Total units:</strong></td>
                                                    <td class="mono">${list.reduce((sum, c) => sum + (Number(c.creditUnits) || 0), 0)}</td>
                                                </tr>
                                                <tr>
                                                    <td colspan="5" style="text-align:right;"><strong>Weighted points:</strong></td>
                                                    <td class="mono">${list.reduce((sum, c) => sum + (gradePoint(c.score) * (Number(c.creditUnits) || 0)), 0).toFixed(2)}</td>
                                                </tr>
                                            </tfoot>
                                        </table>
                                    </div>
                                `).join('')}
                            </div>
                        ` : '<p class="empty">No courses recorded yet. Use “Add course” below to register a whole list at once.</p>'}
                    </div>
                    <div class="details-actions">
                        <button class="btn-primary" onclick="openAddCourse('${recordId}')">+ Add courses</button>
                    </div>
                `;
            } catch (e) {
                body.innerHTML = `<p class="error-msg">Failed to load details: ${escapeHtml(e.message)}</p>`;
            }
        }

        // -----------------------------------------------------------------
        // Add course modal — supports a single row or a whole list at once.
        // -----------------------------------------------------------------
        function courseRowTemplate(index) {
            return `
                <div class="course-row" data-row="${index}">
                    <div class="course-row-head">
                        <span class="row-index">Course ${index + 1}</span>
                        <button type="button" class="btn-remove-field" title="Remove this course" onclick="removeCourseRow(this)">×</button>
                    </div>
                    <div class="course-row-grid">
                        <div class="form-group">
                            <label>Course code</label>
                            <input type="text" class="cr-code" placeholder="e.g. CSC 101" required>
                        </div>
                        <div class="form-group">
                            <label>Course title</label>
                            <input type="text" class="cr-title" placeholder="e.g. Introduction to Computing">
                        </div>
                        <div class="form-group">
                            <label>Credit units</label>
                            <input type="number" class="cr-units" placeholder="2" min="1" max="24" step="0.5" required>
                        </div>
                        <div class="form-group">
                            <label>Score (0–100)</label>
                            <input type="number" class="cr-score" placeholder="75" min="0" max="100" step="0.01" required>
                        </div>
                    </div>
                </div>
            `;
        }

        function openAddCourse(recordId) {
            // Validate recordId
            if (!recordId || typeof recordId !== 'string' || recordId.trim() === '') {
                showToast('Invalid record ID. Please close and reopen the details.', 'error');
                return;
            }
            window.courseEditingRecordId = recordId.trim();

            document.getElementById('courseBody').innerHTML = `
                <h2>Add courses</h2>
                <p>Fill in the shared details once, then add as many courses as you need — they are all saved together.</p>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Session</label>
                        <input type="text" id="courseSession" placeholder="e.g. 2024/2025" required>
                    </div>
                    <div class="form-group">
                        <label>Level</label>
                        <input type="text" id="courseLevel" placeholder="e.g. ND 1" required>
                    </div>
                    <div class="form-group">
                        <label>Semester</label>
                        <select id="courseSemester" required>
                            <option value="1" selected>First semester</option>
                            <option value="2">Second semester</option>
                        </select>
                    </div>
                </div>
                <div class="course-rows" id="courseRows"></div>
                <div class="bulk-toolbar">
                    <button type="button" class="btn-secondary" id="addCourseRowBtn">+ Add another course</button>
                    <span class="bulk-count" id="bulkCount"></span>
                </div>
            `;
            document.getElementById('addCourseRowBtn').onclick = () => addCourseRow();
            addCourseRow();
            addCourseRow(); // start with two rows so the bulk pattern is obvious
            document.getElementById('courseOverlay').classList.remove('hidden');
            document.getElementById('courseOverlay').style.display = '';
            updateBulkCount();
        }

        function addCourseRow() {
            const rows = document.getElementById('courseRows');
            const index = rows.children.length;
            rows.insertAdjacentHTML('beforeend', courseRowTemplate(index));
            updateBulkCount();
            // Focus the first input of the new row for fast keyboard entry
            const newRow = rows.lastElementChild;
            const firstInput = newRow.querySelector('input');
            if (firstInput) firstInput.focus();
        }

        function removeCourseRow(btn) {
            const row = btn.closest('.course-row');
            if (!row) return;
            if (document.getElementById('courseRows').children.length === 1) {
                showToast('At least one course row is required', 'error');
                return;
            }
            row.classList.add('removing');
            setTimeout(() => {
                row.remove();
                renumberCourseRows();
                updateBulkCount();
            }, 150);
        }

        function renumberCourseRows() {
            document.querySelectorAll('#courseRows .course-row').forEach((row, i) => {
                row.querySelector('.row-index').textContent = `Course ${i + 1}`;
            });
        }

        function updateBulkCount() {
            const count = document.querySelectorAll('#courseRows .course-row').length;
            const el = document.getElementById('bulkCount');
            if (el) el.innerHTML = `<strong>${count}</strong> course${count === 1 ? '' : 's'} ready to save`;
        }

        function closeCourse() {
            document.getElementById('courseOverlay').classList.add('hidden');
            document.getElementById('courseOverlay').style.display = 'none';
            window.courseEditingRecordId = null;
        }

        async function saveCourse() {
            // Shared fields
            const session = document.getElementById('courseSession').value.trim();
            const level = document.getElementById('courseLevel').value.trim();
            const semester = parseInt(document.getElementById('courseSemester').value);
            if (!session || !level || isNaN(semester)) {
                showToast('Please fill in session, level and semester.', 'error');
                return;
            }

            // Collect every course row
            const rows = [...document.querySelectorAll('#courseRows .course-row')];
            const courses = [];
            for (const row of rows) {
                const courseCode = row.querySelector('.cr-code').value.trim();
                const courseTitle = row.querySelector('.cr-title').value.trim();
                const creditUnits = parseFloat(row.querySelector('.cr-units').value);
                const score = parseFloat(row.querySelector('.cr-score').value);

                if (!courseCode || isNaN(creditUnits) || creditUnits <= 0 || isNaN(score) || score < 0 || score > 100) {
                    row.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    row.querySelector('.cr-code').focus();
                    showToast(`Row ${rows.indexOf(row) + 1}: course code, credit units (1+) and a score (0–100) are required.`, 'error');
                    return;
                }
                courses.push({ courseCode, courseTitle, creditUnits, score });
            }

            if (courses.length === 0) {
                showToast('Add at least one course.', 'error');
                return;
            }

            const payload = {
                session,
                level,
                semester,
                courses
            };

            try {
                const res = await api.addCourse(window.courseEditingRecordId, payload);
                showToast(`${res.added} course${res.added === 1 ? '' : 's'} added`, 'success');
                closeCourse();
                loadDetail(window.courseEditingRecordId); // refresh
            } catch (e) {
                showToast('Failed to add courses: ' + e.message, 'error');
            }
        }

        // -----------------------------------------------------------------
        // Toasts + small utilities
        // -----------------------------------------------------------------
        function showToast(message, type = 'info') {
            const host = document.getElementById('toastHost');
            if (!host) { alert(message); return; }
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            host.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('out');
                setTimeout(() => toast.remove(), 350);
            }, 3200);
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        document.getElementById('courseConfirm').onclick = saveCourse;

        // UI Listeners
        document.getElementById('searchBtn').onclick = loadRecords;
        document.getElementById('searchBox').oninput = () => {
            clearTimeout(window.__searchTimer);
            window.__searchTimer = setTimeout(loadRecords, 250);
        };
        document.getElementById('searchBox').onkeyup = (e) => { if (e.key === 'Enter') loadRecords(); };
        document.getElementById('addRecBtn').onclick = () => openRecordModal();
        document.getElementById('emptyAddBtn').onclick = () => openRecordModal();
        document.getElementById('modalConfirm').onclick = saveRecord;
        document.getElementById('exportBtn').onclick = () => api.exportRecords(colId);
        document.getElementById('logoutBtn').onclick = async () => {
            await api.logout();
            localStorage.removeItem('token');
            window.location.href = '/';
        };

        document.getElementById('importBtn').onclick = async () => {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = async (e) => {
                const file = e.target.files[0];
                const text = await file.text();
                try {
                    const data = JSON.parse(text);
                    await api.importRecords(colId, data);
                    showToast('Import successful', 'success');
                    await loadRecords();
                } catch (err) {
                    showToast('Invalid JSON file', 'error');
                }
            };
            input.click();
        };

        document.getElementById('dedupBtn').onclick = async () => {
            const field = prompt('Enter the field name to deduplicate by (e.g., email):');
            if (!field) return;
            try {
                const res = await api.deduplicate(colId, field);
                showToast(res.message, 'success');
                await loadRecords();
            } catch (e) {
                showToast(e.message, 'error');
            }
        };

        window.viewDetails = openDetails;
        window.closeDetails = closeDetails;
        window.removeCourseRow = removeCourseRow;
        window.closeModal = closeModal;
        window.closeCourse = closeCourse;

        // Close modals with Escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (!document.getElementById('courseOverlay').classList.contains('hidden')) closeCourse();
                else if (!document.getElementById('detailsOverlay').classList.contains('hidden')) closeDetails();
                else if (!document.getElementById('modalOverlay').classList.contains('hidden')) closeModal();
            }
        });

        window.onload = init;
    </script>
</body>
</html>
