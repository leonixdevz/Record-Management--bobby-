<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Record System</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/theme.js"></script>
</head>
<body class="auth-page">
    <span class="theme-slot floating"></span>
    <div class="auth-card">
        <div class="auth-brand">
            <div class="brand-mark large">R</div>
            <h1>Record Management</h1>
            <p>Administrator access</p>
        </div>
        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" required placeholder="Enter username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="Enter password">
            </div>
            <button type="submit" id="loginBtn" class="btn-primary" style="width:100%;padding:.8rem;">Login</button>
        </form>
        <div id="error" class="error-msg"></div>
    </div>
    <script src="/js/app.js"></script>
    <script>
        // First-run check: if no user/dept is registered, go to setup wizard.
        fetch('/api/setup/status')
            .then(r => r.json())
            .then(s => {
                if (!s.setupDone) {
                    window.location.href = '/setup.html';
                }
            })
            .catch(() => {});

        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const err = document.getElementById('error');
            btn.disabled = true;
            err.textContent = '';

            try {
                const res = await api.login(
                    document.getElementById('username').value,
                    document.getElementById('password').value
                );
                localStorage.setItem('token', res.token);
                window.location.href = '/dashboard.html';
            } catch (e) {
                err.textContent = e.message;
            } finally {
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
