<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - Record System</title>
    <link rel="stylesheet" href="style.css">
    <script src="/js/theme.js"></script>
</head>
<body class="auth-page">
    <span class="theme-slot floating"></span>
    <div class="auth-card">
        <div class="auth-brand">
            <h1>Student Portal</h1>
            <p>Access your academic records</p>
        </div>
        <form id="studentForm">
            <div class="form-group">
                <label>Student ID</label>
                <input type="text" id="studentId" required placeholder="Enter your Student ID">
            </div>
            <div class="form-group">
                <label>PIN</label>
                <input type="password" id="pin" required placeholder="Enter your PIN">
            </div>
            <button type="submit" class="btn-primary" id="loginBtn">Login</button>
            <div id="error" class="error-msg"></div>
            <p class="hint">Ask your department administrator for your PIN if you don't have it.</p>
        </form>
    </div>

    <script src="/js/app.js"></script>
    <script>
        document.getElementById('studentForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const err = document.getElementById('error');
            btn.disabled = true;
            err.textContent = '';

            const studentId = document.getElementById('studentId').value.trim();
            const pin = document.getElementById('pin').value.trim();

            try {
                const data = await api.studentLogin(studentId, pin);
                localStorage.setItem('studentRecordId', data.recordId);
                localStorage.setItem('studentName', data.name);
                localStorage.setItem('deptName', data.deptName);
                window.location.href = '/students-detail/portal.html';
            } catch (ex) {
                err.textContent = ex.message;
            } finally {
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
